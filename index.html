<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rudraksh Telecome - Space Shooter</title>

<style>
* {
    box-sizing: border-box;
    touch-action: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hud {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 17px;
    font-weight: bold;
    z-index: 5;
    pointer-events: none;
}

#brand {
    position: fixed;
    top: 42px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    opacity: .7;
    z-index: 5;
    pointer-events: none;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
}

#joystick {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.3);
    position: relative;
}

#stick {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    position: absolute;
    left: 27px;
    top: 27px;
}

#fire {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    border: 2px solid rgba(255,100,100,.5);
    background: rgba(255,40,40,.25);
    color: white;
    font-size: 20px;
    font-weight: bold;
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.8);
    z-index: 20;
    text-align: center;
}

#gameOver h1 {
    font-size: 42px;
    margin: 10px;
}

#restart {
    padding: 14px 28px;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>❤️ <span id="lives">3</span></div>
    <div>⭐ <span id="score">0</span></div>
    <div>🏆 Level <span id="level">1</span></div>
</div>

<div id="brand">Rudraksh Telecome • Space Shooter</div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="fire">FIRE</button>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restart">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    W = innerWidth;
    H = innerHeight;
}

addEventListener("resize", resize);
resize();

const player = {
    x: W / 2,
    y: H - 150,
    size: 22,
    speed: 5
};

let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let score = 0;
let lives = 3;
let level = 1;
let gameRunning = true;
let firing = false;

let joystickX = 0;
let joystickY = 0;

for (let i = 0; i < 100; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 2 + .5
    });
}

function shoot() {
    if (!gameRunning) return;

    bullets.push({
        x: player.x,
        y: player.y - 25,
        speed: 9,
        size: 5
    });
}

function createEnemy() {
    enemies.push({
        x: 25 + Math.random() * (W - 50),
        y: -30,
        size: 20 + Math.random() * 10,
        speed: 1.5 + level * .25
    });
}

function explosion(x, y) {
    for (let i = 0; i < 18; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - .5) * 7,
            vy: (Math.random() - .5) * 7,
            life: 35
        });
    }
}

function drawStars() {
    ctx.fillStyle = "white";

    for (const s of stars) {
        ctx.globalAlpha = .3 + Math.random() * .7;
        ctx.fillRect(s.x, s.y, s.size, s.size);

        s.y += s.speed;

        if (s.y > H) {
            s.y = 0;
            s.x = Math.random() * W;
        }
    }

    ctx.globalAlpha = 1;
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(22, 24);
    ctx.lineTo(0, 16);
    ctx.lineTo(-22, 24);
    ctx.closePath();

    ctx.fillStyle = "#4deaff";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(9, 10);
    ctx.lineTo(-9, 10);
    ctx.closePath();

    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.fillStyle = "#ff9d00";
    ctx.fillRect(-6, 17, 12, 12);

    ctx.restore();
}

function drawBullet(b) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fillStyle = "#ffe600";
    ctx.fill();
}

function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.beginPath();
    ctx.arc(0, 0, e.size, 0, Math.PI * 2);
    ctx.fillStyle = "#ff4268";
    ctx.fill();

    ctx.fillStyle = "#19000a";
    ctx.fillRect(-9, -5, 5, 8);
    ctx.fillRect(4, -5, 5, 8);

    ctx.restore();
}

function update() {
    if (!gameRunning) return;

    // Player movement
    player.x += joystickX * player.speed;
    player.y += joystickY * player.speed;

    player.x = Math.max(25, Math.min(W - 25, player.x));
    player.y = Math.max(70, Math.min(H - 130, player.y));

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;

        if (bullets[i].y < -20) {
            bullets.splice(i, 1);
        }
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        e.y += e.speed;

        if (e.y > H + 40) {
            enemies.splice(i, 1);
            lives--;

            document.getElementById("lives").textContent = lives;

            if (lives <= 0) {
                endGame();
            }

            continue;
        }

        // Player collision
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < e.size + player.size) {
            explosion(e.x, e.y);
            enemies.splice(i, 1);
            lives--;

            document.getElementById("lives").textContent = lives;

            if (lives <= 0) {
                endGame();
            }
        }
    }

    // Bullet collisions
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];

            const dx = b.x - e.x;
            const dy = b.y - e.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < e.size + b.size) {
                explosion(e.x, e.y);

                bullets.splice(i, 1);
                enemies.splice(j, 1);

                score += 10;
                document.getElementById("score").textContent = score;

                level = Math.floor(score / 100) + 1;
                document.getElementById("level").textContent = level;

                break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    // Spawn enemies
    const spawnChance = .025 + level * .004;

    if (Math.random() < spawnChance) {
        createEnemy();
    }

    // Automatic repeated fire while FIRE is held
    if (firing && Math.random() < .25) {
        shoot();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / 35;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#ffb300";
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    // Space background
    ctx.fillStyle = "#02030a";
    ctx.fillRect(0, 0, W, H);

    drawStars();

    for (const b of bullets) drawBullet(b);
    for (const e of enemies) drawEnemy(e);

    drawParticles();
    drawPlayer();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function endGame() {
    gameRunning = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "flex";
}

document.getElementById("restart").addEventListener("click", () => {
    score = 0;
    lives = 3;
    level = 1;

    bullets = [];
    enemies = [];
    particles = [];

    player.x = W / 2;
    player.y = H - 150;

    document.getElementById("score").textContent = "0";
    document.getElementById("lives").textContent = "3";
    document.getElementById("level").textContent = "1";

    document.getElementById("gameOver").style.display = "none";

    gameRunning = true;
});

// FIRE button
const fire = document.getElementById("fire");

fire.addEventListener("pointerdown", e => {
    e.preventDefault();
    firing = true;
    shoot();
});

fire.addEventListener("pointerup", e => {
    e.preventDefault();
    firing = false;
});

fire.addEventListener("pointercancel", () => {
    firing = false;
});

// Joystick
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

function moveJoystick(e) {
    const rect = joystick.getBoundingClientRect();

    let x = e.clientX - (rect.left + rect.width / 2);
    let y = e.clientY - (rect.top + rect.height / 2);

    const max = 35;
    const distance = Math.sqrt(x*x + y*y);

    if (distance > max) {
        x = x / distance * max;
        y = y / distance * max;
    }

    joystickX = x / max;
    joystickY = y / max;

    stick.style.transform =
        `translate(${x}px, ${y}px)`;
}

function resetJoystick() {
    joystickX = 0;
    joystickY = 0;
    stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerdown", e => {
    joystick.setPointerCapture(e.pointerId);
    moveJoystick(e);
});

joystick.addEventListener("pointermove", e => {
    if (e.buttons) moveJoystick(e);
});

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

// Keyboard support
addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") joystickX = -1;
    if (e.key === "ArrowRight") joystickX = 1;
    if (e.key === "ArrowUp") joystickY = -1;
    if (e.key === "ArrowDown") joystickY = 1;

    if (e.code === "Space") {
        firing = true;
        shoot();
    }
});

addEventListener("keyup", e => {
    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) joystickX = 0;

    if (
        e.key === "ArrowUp" ||
        e.key === "ArrowDown"
    ) joystickY = 0;

    if (e.code === "Space") firing = false;
});

loop();
</script>

</body>
</html>
